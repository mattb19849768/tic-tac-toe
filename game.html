<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Tic-Tac-Toe Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Neon Tic-Tac-Toe</h1>

  <div class="status" id="status">Loading...</div>
 <div class="board-frame"> 
  <div class="board" id="board">
    <div class="cell" data-cell="0"></div>
    <div class="cell" data-cell="1"></div>
    <div class="cell" data-cell="2"></div>
    <div class="cell" data-cell="3"></div>
    <div class="cell" data-cell="4"></div>
    <div class="cell" data-cell="5"></div>
    <div class="cell" data-cell="6"></div>
    <div class="cell" data-cell="7"></div>
    <div class="cell" data-cell="8"></div>
   </div>
</div>
  <div class="center">
    <button id="newRoundBtn">New Round</button>
    <button onclick="window.location='index.html'">Home</button>
  </div>

  <div class="status" id="scoreboard">
    X Wins: <span id="scoreX">0</span> | 
    O Wins: <span id="scoreO">0</span> | 
    Ties: <span id="scoreTies">0</span>
  </div>
    <footer>
    <img src="images/logo.png" alt="Game Hub Logo" class="footer-logo" />
    © 2025 Daddy — Hosted on GitHub Pages
  </footer>
</div>



<div id="resultModal">
  <div class="modal-content">
    <span id="closeModal">&times;</span>
    <div id="resultText">Player X Wins!</div>
    <button id="restartBtn">Play Again</button>
  </div>
</div>


<script src="game.js"></script>
</body>
</html>
